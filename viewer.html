<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bladwijzer viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
<style>
:root{--bg:#fbfaf7;--panel:#f3f1ec;--fg:#1f2328;--mut:#6b6f76;--line:#e3e0d8;--acc:#9a3412;--sel:#efe2d6}
@media (prefers-color-scheme:dark){:root{--bg:#16171a;--panel:#1d1f23;--fg:#e8e6e1;--mut:#9a9da3;--line:#2c2e33;--acc:#f0926a;--sel:#3a2a22}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
a{color:var(--acc)}
.app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/3;display:flex;gap:12px;align-items:baseline;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0}
header .sub{color:var(--mut)}
aside{border-right:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0}
aside ul{list-style:none;margin:0;padding:6px}
aside li button{all:unset;cursor:pointer;display:block;width:100%;padding:6px 8px;border-radius:6px}
aside li button:hover{background:var(--sel)}
aside li button[aria-current="true"]{background:var(--sel);font-weight:600}
aside .filter{position:sticky;top:0;background:var(--panel);padding:8px;border-bottom:1px solid var(--line)}
aside input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
main{display:grid;grid-template-rows:1fr auto;min-height:0}
#osd{min-height:0;background:#222}
#meta{border-top:1px solid var(--line);padding:8px 16px;max-height:30vh;overflow:auto}
#meta dl{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;margin:0}
#meta dt{color:var(--mut)}
#meta dd{margin:0}
.note{color:var(--mut);font-size:12px}
@media (max-width:700px){.app{grid-template-columns:1fr;grid-template-rows:auto 35vh 1fr}aside{border-right:0;border-bottom:1px solid var(--line)}header{grid-column:1}}
</style>
</head>
<body>
<div class="app">
  <header><h1 id="title">Bladwijzer viewer</h1><span class="sub" id="count"></span><a href="./">← alle bladwijzers</a></header>
  <aside><div class="filter"><input id="q" type="search" placeholder="Filter bladen…" aria-label="Filter bladen"></div><ul id="list"></ul></aside>
  <main><div id="osd"></div><div id="meta"><span class="note">Kies een blad in de lijst.</span></div></main>
</div>
<script>
const params=new URLSearchParams(location.search);
const src=params.get('c')||params.get('m');
const txt=v=>{if(v==null)return'';if(typeof v==='string')return v;if(Array.isArray(v))return v.map(txt).join('; ');if(v['@value'])return v['@value'];return Object.values(v).flat().map(txt).join('; ')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const viewer=OpenSeadragon({id:'osd',prefixUrl:'https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/',crossOriginPolicy:false,showNavigator:true,maxZoomPixelRatio:3});
let items=[],current=null;
function imageOf(m){
  if(m.sequences){const r=m.sequences[0].canvases[0].images[0].resource;const s=r.service&&(r.service['@id']||r.service.id);return s?{tile:s+'/info.json'}:{url:r['@id']};}
  const b=m.items[0].items[0].items[0].body;let s=b.service;if(Array.isArray(s))s=s[0];const sid=s&&(s.id||s['@id']);
  if(sid)return{tile:sid+'/info.json'};
  let u=b.id; if(/nla\.gov\.au\/nla\.obj-\d+\/image$/.test(u))u+='?wid=4000';   // NLA: no IIIF image service, no CORS -> plain image
  return{url:u};
}
async function openManifest(url,btn){
  document.querySelectorAll('aside button').forEach(b=>b.removeAttribute('aria-current'));
  if(btn)btn.setAttribute('aria-current','true');
  const meta=document.getElementById('meta');meta.innerHTML='<span class="note">Laden…</span>';
  try{
    const m=await (await fetch(url)).json(); current=m;
    const im=imageOf(m);
    viewer.open(im.tile?im.tile:{type:'image',url:im.url,crossOriginPolicy:false});
    const rows=(m.metadata||[]).map(x=>`<dt>${esc(txt(x.label))}</dt><dd>${esc(txt(x.value)).replace(/(https?:\/\/[^\s;<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}</dd>`).join('');
    meta.innerHTML=`<p><strong>${esc(txt(m.label))}</strong> · <a href="${esc(url)}" target="_blank" rel="noopener">IIIF manifest</a>${im.tile?' · deep zoom':' · <span class="note">NLA-afbeelding (geen IIIF Image API)</span>'}</p><dl>${rows}</dl>`;
    history.replaceState(null,'',location.pathname+'?'+(params.get('c')?'c='+encodeURIComponent(params.get('c'))+'&':'')+'m='+encodeURIComponent(url));
  }catch(e){meta.innerHTML='<span class="note">Kon dit blad niet laden.</span>';}
}
function render(filter=''){
  const ul=document.getElementById('list');ul.innerHTML='';
  const f=filter.toLowerCase();
  items.filter(it=>!f||it.label.toLowerCase().includes(f)).forEach(it=>{
    const li=document.createElement('li');const b=document.createElement('button');b.textContent=it.label;b.onclick=()=>openManifest(it.id,b);li.appendChild(b);ul.appendChild(li);
  });
}
(async()=>{
  if(!src){document.getElementById('title').textContent='Geen collectie of manifest opgegeven';return;}
  const j=await (await fetch(src)).json();
  if(j.type==='Collection'||j['@type']==='sc:Collection'){
    document.getElementById('title').textContent=txt(j.label);
    items=(j.items||j.manifests||[]).map(x=>({id:x.id||x['@id'],label:txt(x.label)}));
    document.getElementById('count').textContent=items.length+' bladen';
    render();
    document.getElementById('q').oninput=e=>render(e.target.value);
    const want=params.get('m'); const first=want||items[0]?.id;
    if(first){const b=[...document.querySelectorAll('aside button')][Math.max(0,items.findIndex(i=>i.id===first))];openManifest(first,b);}
  }else{
    items=[{id:src,label:txt(j.label)}];render();openManifest(src,document.querySelector('aside button'));
    document.getElementById('title').textContent=txt(j.label);
  }
})();
</script>
</body>
</html>
